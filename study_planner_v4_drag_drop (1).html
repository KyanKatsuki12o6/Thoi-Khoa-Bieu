<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Planner</title>
<style>
:root{
  --wine:#6f243d; --wine2:#8f3553; --cream:#fffafc; --ink:#3b2940;
  --muted:#827487; --line:#eadde4; --bg:#f6edf2; --card:#ffffff;
  --blue:#a9b9e9; --pink:#efb4d2; --yellow:#f3d38c; --green:#a9d7b5; --purple:#c7b3ea;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(135deg,#f8eef3,#eeeaf7);min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
.app{display:block;min-height:100vh}
.sidebar{width:190px;background:linear-gradient(180deg,#3e2438,#60243d 65%,#4b2942);color:#fff;padding:24px 14px;position:sticky;top:0;height:100vh}
.brand{font-size:24px;font-weight:900;letter-spacing:.5px;text-align:center}
.brand small{display:block;font-size:13px;font-weight:600;opacity:.8;margin-top:2px}
.nav{margin-top:28px;display:grid;gap:8px}
.nav button{background:transparent;color:#fff;padding:11px 12px;border-radius:13px;text-align:left;opacity:.88}
.nav button.active,.nav button:hover{background:rgba(255,255,255,.14);opacity:1}
.side-note{margin-top:80px;text-align:center;font-size:13px;line-height:1.7;opacity:.8}
.feather{font-size:28px;display:block;margin:15px auto}
.main{flex:1;min-width:0;padding:24px;max-width:1500px;margin:0 auto;width:100%}
.hero{background:linear-gradient(120deg,#5c2039,#8a3150);border-radius:22px;color:white;padding:22px 28px;position:relative;overflow:hidden;box-shadow:0 12px 35px #5c203922}
.hero:after{content:"✦   ╱╲   ✦   ╱╲   ✦";position:absolute;right:30px;top:20px;font-size:28px;letter-spacing:5px;opacity:.8}
.hero h1{margin:0;font-size:30px}
.hero p{margin:7px 0 0;opacity:.9}
.layout{display:grid;grid-template-columns:1fr;gap:18px;margin-top:18px}
.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 25px #6f243d10}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.card-head h2{margin:0;font-size:18px}
.week-tools{display:flex;align-items:center;gap:8px}
.small-btn{background:#f4eaf0;color:var(--wine);padding:7px 10px;border-radius:10px}
.small-btn:hover{background:#ead7e0}
.week-label{font-weight:700}
.schedule{padding:16px;overflow:auto}
.grid{display:grid;grid-template-columns:90px repeat(7,minmax(145px,1fr));min-width:1100px}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px}
.day{font-weight:800;text-align:center;padding:10px 5px;background:#fcf7fa}
.day.today{color:var(--wine);background:#f7e8ee}
.time{display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:800;color:var(--muted);background:#fbf7f9}
.slot{min-height:106px;background:#fff;position:relative}
.add{width:100%;height:100%;min-height:90px;border:1px dashed #d9cbd4;background:#fff;color:#b5a8b0;border-radius:12px}
.add:hover{background:#fcf5f8}
.event{border-radius:12px;padding:10px;min-height:88px;position:relative;border-left:5px solid var(--wine);box-shadow:0 3px 9px #5c203912}
.event.done{opacity:.58;text-decoration:line-through}
.event .subject{font-weight:900;font-size:14px}
.event .topic{font-size:12px;margin-top:5px;color:#665a67}
.event .meta{font-size:11px;color:#8d7d8d;margin-top:7px}
.event .actions{position:absolute;right:5px;top:5px;display:flex;gap:3px}
.icon-btn{background:#ffffffaa;border-radius:7px;padding:3px 5px;font-size:11px}
.right{display:grid;gap:18px;align-content:start}
.progress-list{padding:14px 18px}
.progress-row{margin:12px 0}
.progress-top{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.bar{height:8px;background:#eee7eb;border-radius:99px;overflow:hidden;margin-top:5px}
.fill{height:100%;border-radius:99px}
.todo{padding:14px 18px}
.todo-item{display:flex;gap:8px;align-items:center;padding:8px 0;font-size:13px;border-bottom:1px dashed var(--line)}
.todo-item:last-child{border:0}
.todo-item input{accent-color:var(--wine)}
.add-todo{display:flex;gap:7px;margin-top:10px}
.add-todo input{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.primary{background:var(--wine);color:#fff;padding:9px 13px;border-radius:10px}
.primary:hover{background:var(--wine2)}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.subjects,.mock,.goal,.quote{padding:18px}
.subject-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0e8ec}
.subject-row:last-child{border:0}
.dot{width:10px;height:10px;border-radius:50%}
.subject-row span:nth-child(2){font-weight:800;flex:1}
.quote{background:#fff4f8;position:relative}
.quote p{font-family:Georgia,serif;font-style:italic;line-height:1.7;margin:5px 0}
.goal strong{font-size:22px;color:var(--wine)}
.goal .bar{height:10px;margin:12px 0}
.modal-backdrop{position:fixed;inset:0;background:#2a1b25aa;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal-backdrop.show{display:flex}
.modal{width:min(480px,100%);background:#fff;border-radius:20px;padding:22px;box-shadow:0 20px 70px #0004}
.modal h3{margin-top:0}
.form{display:grid;gap:12px}
.form label{font-size:12px;font-weight:800;color:#6f6170}
.form input,.form select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.danger{background:#f7e0e7;color:#8b2949;padding:9px 13px;border-radius:10px}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.right{grid-template-columns:1fr 1fr}.bottom{grid-template-columns:1fr}}
@media(max-width:700px){.sidebar{display:none}.main{padding:12px}.right{grid-template-columns:1fr}.hero h1{font-size:24px}}
</style>

<style>

.hero h1{margin:0;font-size:30px}
.hero p{margin:8px 0 0;opacity:.9}
.hero:after{content:"✦   ╱╲   ✦   ╱╲   ✦";position:absolute;right:30px;top:20px;font-size:28px;letter-spacing:5px;opacity:.8}
.layout{display:block;margin-top:18px}
.timetable-card{margin-top:18px}
.schedule{padding:16px;overflow:auto}
.grid{display:grid;grid-template-columns:90px repeat(7,minmax(150px,1fr));min-width:1150px}

.slot{min-height:130px;background:#fff;position:relative;transition:.15s}
.slot.drag-over{background:#f8eaf0;box-shadow:inset 0 0 0 2px #b56a84}
.empty-slot{height:100%;min-height:112px;display:flex;align-items:center;justify-content:center;text-align:center;color:#c4b5be;font-size:12px;border:1px dashed #e3d5dc;border-radius:12px}

.time-settings,.palette-card{margin-top:18px}
.hint{font-size:12px;color:#8b7b87}
.time-editor{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;padding:18px}
.time-setting{display:grid;gap:6px}
.time-setting label{font-size:12px;font-weight:800;color:#6f6170}
.time-setting input,.custom-add input{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.palette{display:flex;flex-wrap:wrap;gap:10px;padding:18px}
.palette-item{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:13px;background:#fff;border:1px solid var(--line);box-shadow:0 3px 10px #6f243d0b;cursor:grab;user-select:none;min-width:135px}
.palette-item:hover{transform:translateY(-1px);box-shadow:0 6px 15px #6f243d16}
.palette-item:active{cursor:grabbing}
.palette-dot{width:11px;height:11px;border-radius:50%;background:var(--subject-color);flex:none}
.drag-mark{margin-left:auto;color:#b3a3ac;letter-spacing:-2px}
.custom-add{display:flex;gap:9px;padding:0 18px 18px}
.custom-add input{flex:1}
.primary{background:var(--wine);color:#fff;padding:10px 14px;border-radius:10px}
.primary:hover{background:var(--wine2)}
.small-btn{background:#f4eaf0;color:var(--wine);padding:8px 11px;border-radius:10px}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.card-head h2{margin:0;font-size:18px}
.week-tools{display:flex;align-items:center;gap:8px}
.week-label{font-weight:700}
.modal-backdrop{position:fixed;inset:0;background:#2a1b25aa;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}

.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}

@media(max-width:800px){
 .main{padding:12px}
 .time-editor{grid-template-columns:1fr}
 .hero h1{font-size:24px}
 .hero:after{display:none}
}
</style>
</head>

<body>
<div class="app">
  <main class="main">
    <section class="hero">
      <h1>Study Planner</h1>
      <p>Kéo các khung học bên dưới vào TKB để tự sắp xếp lịch của bạn.</p>
    </section>

    <section class="card timetable-card">
      <div class="card-head">
        <h2>Thời khóa biểu</h2>
        <div class="week-tools">
          <button class="small-btn" id="prevWeek">‹</button>
          <span class="week-label" id="weekLabel"></span>
          <button class="small-btn" id="nextWeek">›</button>
          <button class="small-btn" id="todayBtn">Hôm nay</button>
        </div>
      </div>
      <div class="schedule">
        <div class="grid" id="schedule"></div>
      </div>
    </section>

    <section class="card time-settings">
      <div class="card-head">
        <h2>Khung giờ</h2>
        <span class="hint">Bấm vào thời gian để chỉnh theo lịch thật của bạn.</span>
      </div>
      <div class="time-editor">
        <div class="time-setting">
          <label>Sáng</label>
          <input id="morningTime" value="06:00 – 11:30">
        </div>
        <div class="time-setting">
          <label>Chiều</label>
          <input id="afternoonTime" value="13:00 – 17:30">
        </div>
        <div class="time-setting">
          <label>Tối</label>
          <input id="eveningTime" value="18:30 – 22:30">
        </div>
        <button class="primary" id="saveTimes">Lưu khung giờ</button>
      </div>
    </section>

    <section class="card palette-card">
      <div class="card-head">
        <div>
          <h2>Khung học</h2>
          <div class="hint">Kéo một khung vào ô TKB. Thả ra rồi chỉnh nội dung nếu muốn.</div>
        </div>
        <button class="small-btn" id="resetBoard">Xóa toàn bộ TKB</button>
      </div>
      <div class="palette" id="palette"></div>
      <div class="custom-add">
        <input id="newSubject" placeholder="Tên môn / khung học mới...">
        <button class="primary" id="addSubject">+ Thêm khung</button>
      </div>
    </section>
  </main>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h3>Chỉnh buổi học</h3>
    <form class="form" id="eventForm">
      <label>Môn / tên khung
        <input id="subjectInput" required>
      </label>
      <label>Nội dung
        <input id="topicInput" placeholder="VD: Hàm số, đọc hiểu, làm đề...">
      </label>
      <label>Ngày
        <select id="dayInput"></select>
      </label>
      <label>Buổi
        <select id="timeInput"></select>
      </label>
      <div class="form-actions">
        <button type="button" class="danger" id="deleteBtn">Xóa</button>
        <button type="button" class="small-btn" id="cancelBtn">Hủy</button>
        <button class="primary">Lưu</button>
      </div>
    </form>
  </div>
</div>

<script>
const DAYS=['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7','Chủ nhật'];
const DEFAULT_SUBJECTS=[
  ['Toán','#9aaee7'],['Ngữ văn','#e7a5c6'],['Tiếng Anh','#e8c77f'],
  ['Khoa học','#91cda2'],['Tư duy logic','#b59ae3'],['Khoa học xã hội','#83bfd3'],
  ['Đọc hiểu','#a999df'],['Làm đề','#d4a7b9']
];
const savedSubjects=JSON.parse(localStorage.getItem('dgnl-subjects')||'null');
let subjects=savedSubjects||DEFAULT_SUBJECTS;
let times=JSON.parse(localStorage.getItem('dgnl-times')||'null')||{
  morning:'06:00 – 11:30', afternoon:'13:00 – 17:30', evening:'18:30 – 22:30'
};
let events=JSON.parse(localStorage.getItem('dgnl-events-v4')||'[]');
let weekOffset=0, editingIndex=null, draggedPalette=null;

const SLOTS=[
  {id:'morning',label:'Sáng'},
  {id:'afternoon',label:'Chiều'},
  {id:'evening',label:'Tối'}
];

function save(){
  localStorage.setItem('dgnl-events-v4',JSON.stringify(events));
  localStorage.setItem('dgnl-subjects',JSON.stringify(subjects));
  localStorage.setItem('dgnl-times',JSON.stringify(times));
}
function dateForDay(day){
  const now=new Date(), monday=new Date(now);
  const dow=(now.getDay()+6)%7;
  monday.setDate(now.getDate()-dow+weekOffset*7+day);
  return monday;
}
function fmt(d){return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')}

function slotTime(slot){
  return times[slot];
}

function renderSchedule(){
  const el=document.getElementById('schedule');
  el.innerHTML='';
  const corner=document.createElement('div');
  corner.className='cell day corner';
  corner.textContent='';
  el.appendChild(corner);

  DAYS.forEach((d,i)=>{
    const c=document.createElement('div');
    c.className='cell day'+(weekOffset===0&&i===((new Date().getDay()+6)%7)?' today':'');
    c.innerHTML=`${d}<br><small>${fmt(dateForDay(i))}</small>`;
    el.appendChild(c);
  });

  SLOTS.forEach((s,slotIndex)=>{
    const t=document.createElement('div');
    t.className='cell time';
    t.innerHTML=`<b>${s.label}</b><br><small>${slotTime(s.id)}</small>`;
    t.title='Có thể chỉnh khung giờ ở phần Khung giờ bên dưới';
    el.appendChild(t);

    DAYS.forEach((_,dayIndex)=>{
      const cell=document.createElement('div');
      cell.className='cell slot';
      cell.dataset.day=dayIndex;
      cell.dataset.slot=slotIndex;

      cell.addEventListener('dragover',e=>{e.preventDefault();cell.classList.add('drag-over')});
      cell.addEventListener('dragleave',()=>cell.classList.remove('drag-over'));
      cell.addEventListener('drop',e=>{
        e.preventDefault();
        cell.classList.remove('drag-over');
        const idx=e.dataTransfer.getData('event-index');
        const paletteName=e.dataTransfer.getData('palette-subject');
        if(idx!==''){
          const i=Number(idx);
          if(events[i]){
            events[i].day=dayIndex;
            events[i].slot=slotIndex;
            save();
            renderSchedule();
          }
        }else if(paletteName){
          events.push({
            day:dayIndex,
            slot:slotIndex,
            subject:paletteName,
            topic:'',
            done:false
          });
          save();
          renderSchedule();
        }
      });

      const idx=events.findIndex(e=>e.day===dayIndex&&e.slot===slotIndex);
      if(idx<0){
        cell.innerHTML='<div class="empty-slot">Thả khung học vào đây</div>';
      }else{
        const e=events[idx];
        const color=subjects.find(x=>x[0]===e.subject)?.[1]||'#b9a7b5';
        cell.innerHTML=`<div class="event ${e.done?'done':''}" draggable="true" data-index="${idx}" style="border-left-color:${color};background:${color}22">
          <div class="actions">
            <button class="icon-btn" title="Hoàn thành" onclick="toggleDone(${idx})">✓</button>
            <button class="icon-btn" title="Sửa" onclick="openModal(${idx})">Sửa</button>
          </div>
          <div class="subject">${escapeHtml(e.subject)}</div>
          <div class="topic">${escapeHtml(e.topic||'Bấm Sửa để thêm nội dung')}</div>
          <div class="meta">${slotTime(SLOTS[e.slot].id)}</div>
        </div>`;
        const eventEl=cell.querySelector('.event');
        eventEl.addEventListener('dragstart',ev=>{
          ev.dataTransfer.setData('event-index',String(idx));
          ev.dataTransfer.effectAllowed='move';
        });
      }
      el.appendChild(cell);
    });
  });
  document.getElementById('weekLabel').textContent=`${fmt(dateForDay(0))} – ${fmt(dateForDay(6))}`;
}

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

function renderPalette(){
  const el=document.getElementById('palette');
  el.innerHTML='';
  subjects.forEach((s,i)=>{
    const card=document.createElement('div');
    card.className='palette-item';
    card.draggable=true;
    card.dataset.subject=s[0];
    card.style.setProperty('--subject-color',s[1]);
    card.innerHTML=`<span class="palette-dot"></span><strong>${escapeHtml(s[0])}</strong><span class="drag-mark">⋮⋮</span>`;
    card.addEventListener('dragstart',e=>{
      draggedPalette=s[0];
      e.dataTransfer.setData('palette-subject',s[0]);
      e.dataTransfer.effectAllowed='copy';
    });
    el.appendChild(card);
  });
}

function renderTimeInputs(){
  morningTime.value=times.morning;
  afternoonTime.value=times.afternoon;
  eveningTime.value=times.evening;
}

function toggleDone(i){events[i].done=!events[i].done;save();renderSchedule()}

function openModal(idx){
  editingIndex=idx;
  const e=events[idx];
  subjectInput.value=e.subject;
  topicInput.value=e.topic||'';
  dayInput.innerHTML=DAYS.map((d,i)=>`<option value="${i}">${d}</option>`).join('');
  timeInput.innerHTML=SLOTS.map((s,i)=>`<option value="${i}">${s.label} — ${slotTime(s.id)}</option>`).join('');
  dayInput.value=e.day;
  timeInput.value=e.slot;
  modal.classList.add('show');
}
function closeModal(){modal.classList.remove('show');editingIndex=null}
cancelBtn.onclick=closeModal;
eventForm.onsubmit=e=>{
  e.preventDefault();
  if(editingIndex===null)return;
  events[editingIndex].subject=subjectInput.value.trim()||'Khung học';
  events[editingIndex].topic=topicInput.value.trim();
  events[editingIndex].day=Number(dayInput.value);
  events[editingIndex].slot=Number(timeInput.value);
  save();closeModal();renderSchedule();
};
deleteBtn.onclick=()=>{
  if(editingIndex!==null){
    events.splice(editingIndex,1);
    save();closeModal();renderSchedule();
  }
};

saveTimes.onclick=()=>{
  times={
    morning:morningTime.value.trim()||'06:00 – 11:30',
    afternoon:afternoonTime.value.trim()||'13:00 – 17:30',
    evening:eveningTime.value.trim()||'18:30 – 22:30'
  };
  save();renderSchedule();
};

addSubject.onclick=()=>{
  const name=newSubject.value.trim();
  if(!name)return;
  if(!subjects.some(s=>s[0].toLowerCase()===name.toLowerCase())){
    const colors=['#9aaee7','#e7a5c6','#e8c77f','#91cda2','#b59ae3','#83bfd3','#d4a7b9'];
    subjects.push([name,colors[subjects.length%colors.length]]);
    save();renderPalette();
  }
  newSubject.value='';
};

resetBoard.onclick=()=>{
  if(confirm('Xóa toàn bộ các buổi học đang có trong TKB?')){
    events=[];save();renderSchedule();
  }
};

prevWeek.onclick=()=>{weekOffset--;renderSchedule()};
nextWeek.onclick=()=>{weekOffset++;renderSchedule()};
todayBtn.onclick=()=>{weekOffset=0;renderSchedule()};

renderTimeInputs();
renderPalette();
renderSchedule();
</script>
</body>

</html>
